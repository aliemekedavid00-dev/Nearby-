<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Nearby</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">

<style>
:root {
  --paper:#F3F5FB;
  --ink:#12172E;
  --muted:#5F678A;
  --line:#DFE3F0;
  --event:#3B3BF2;
  --event-soft:#E6E6FE;
  --deal:#FFC53D;
  --deal-soft:#FFF3D1;
}

* {
  box-sizing:border-box;
  margin:0;
}

html,body {
  background:var(--paper);
  color:var(--ink);
}

body {
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,
  "Helvetica Neue",sans-serif;
  -webkit-text-size-adjust:100%;
}

button,input,select,textarea {
  font:inherit;
  color:inherit;
}

button {
  background:none;
  border:0;
  cursor:pointer;
}

button:disabled {
  cursor:not-allowed;
}

[hidden] {
  display:none !important;
}

#shell {
  max-width:430px;
  min-height:100vh;
  min-height:100dvh;
  margin:0 auto;
  display:flex;
  flex-direction:column;
}

header {
  padding:24px 20px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

h1 {
  font-size:32px;
  font-weight:800;
}

.addBtn {
  display:flex;
  align-items:center;
  gap:6px;
  height:44px;
  padding:0 16px;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-size:14px;
  font-weight:700;
}

.banner {
  margin:0 20px 12px;
  padding:12px 14px;
  border-radius:14px;
  font-size:13px;
  line-height:1.45;
  background:var(--deal-soft);
}

.banner button {
  font-weight:700;
  text-decoration:underline;
}

.filters {
  padding:0 20px;
  display:grid;
  gap:12px;
}

.locRow {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-size:13px;
  color:var(--muted);
}

.locLeft {
  display:flex;
  align-items:center;
  gap:6px;
  min-width:0;
}

.locText {
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.radiusBtn {
  height:34px;
  padding:0 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  font-size:13px;
  font-weight:600;
  white-space:nowrap;
}

.seg {
  display:flex;
  padding:4px;
  border-radius:12px;
  background:#E4E8F4;
}

.seg button {
  flex:1;
  height:40px;
  border-radius:8px;
  font-size:14px;
  font-weight:700;
  color:var(--muted);
  text-align:center;
}

.seg button[aria-pressed="true"] {
  background:#fff;
  color:var(--ink);
}

.chips {
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar {
  display:none;
}

.chip {
  flex:none;
  height:36px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  font-size:14px;
  white-space:nowrap;
}

.chip[aria-pressed="true"] {
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}

main {
  flex:1;
  padding:16px 20px 24px;
  display:grid;
  gap:12px;
  align-content:start;
}

.card {
  display:flex;
  overflow:hidden;
  border-radius:16px;
  background:#fff;
  border:1px solid var(--line);
}

.cardMain {
  display:flex;
  flex:1;
  min-width:0;
}

.stub {
  flex:none;
  width:76px;
  padding:12px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.stub.ev {
  background:var(--event);
  color:#fff;
}

.stub.dl {
  background:var(--deal);
  color:var(--ink);
}

.stub .big {
  font-weight:800;
  line-height:1;
}

.stub .small {
  font-size:12px;
  font-weight:600;
  margin-top:4px;
}

.body {
  flex:1;
  min-width:0;
  padding:12px;
}

.title {
  font-size:16px;
  font-weight:700;
  line-height:1.3;
}

.meta {
  margin-top:6px;
  display:grid;
  gap:4px;
  font-size:13px;
  color:var(--muted);
}

.meta div {
  display:flex;
  gap:6px;
}

.tags {
  margin-top:8px;
  display:flex;
  gap:8px;
  font-size:12px;
}

.pill {
  padding:2px 8px;
  border-radius:999px;
}

.pill.event {
  background:var(--event-soft);
}

.pill.deal {
  background:var(--deal-soft);
}

.heart {
  width:44px;
  height:44px;
  color:var(--muted);
}

.heart[aria-pressed="true"] {
  color:var(--event);
}

.empty {
  padding:24px;
  text-align:center;
  border-radius:16px;
  border:1.5px dashed var(--line);
  background:#fff;
}

.empty h3 {
  font-size:17px;
}

.empty p {
  margin-top:4px;
  font-size:14px;
  color:var(--muted);
}

.empty button {
  margin-top:16px;
  height:40px;
  padding:0 16px;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-weight:700;
}

#mapPane {
  padding:16px 20px 24px;
}

#map {
  height:52vh;
  min-height:320px;
  border-radius:16px;
  border:1px solid var(--line);
  overflow:hidden;
  background:#E9EDF7;
}

nav {
  position:sticky;
  bottom:0;
  display:flex;
  background:#fff;
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}

nav button {
  flex:1;
  height:60px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-size:12px;
  font-weight:600;
  color:var(--muted);
}

nav button[aria-current="page"] {
  color:var(--event);
}

.backdrop {
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(18,23,46,.5);
}

.sheet {
  width:100%;
  max-width:430px;
  max-height:92vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:24px 24px 0 0;
  padding:20px;
}

.closeBtn {
  float:right;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#fff;
  border:1px solid var(--line);
}

.sheet h2 {
  font-size:24px;
  margin-top:16px;
}

.facts {
  margin-top:12px;
  display:grid;
  gap:8px;
}

.blurb {
  margin-top:16px;
  font-size:15px;
  line-height:1.55;
  color:var(--muted);
}

.actions {
  margin-top:24px;
  display:flex;
  gap:12px;
}

.actions button {
  flex:1;
  height:50px;
  border-radius:12px;
  font-weight:700;
  text-align:center;
}

.btnGhost {
  background:#fff;
  border:1px solid var(--line);
}

.btnDark {
  background:var(--ink);
  color:#fff;
}

.form {
  margin-top:16px;
  display:grid;
  gap:16px;
}

.form label {
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.form input,
.form select,
.form textarea {
  width:100%;
  min-height:46px;
  padding:0 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
}

.form textarea {
  padding:12px;
  min-height:84px;
}

.pubBtn {
  width:100%;
  height:52px;
  border-radius:12px;
  background:var(--event);
  color:#fff;
  font-weight:700;
}

#toast {
  position:fixed;
  z-index:1100;
  left:50%;
  bottom:84px;
  transform:translateX(-50%);
  max-width:90vw;
  padding:10px 18px;
  border-radius:999px;
  background:var(--ink);
  color:#fff;
  font-size:14px;
  font-weight:600;
}
</style>
</head>

</div>

<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const CONFIG = {
  SUPABASE_URL: "https://exhbtxcffcbjrrqzfsyt.supabase.co",
  SUPABASE_KEY: "sb_publishable_Q_efoxMz4wmroFazso_ZUw_Tey6UYVv"
};

const LIVE = Boolean(
  CONFIG.SUPABASE_URL &&
  CONFIG.SUPABASE_KEY
);


/* =========================================================
   IMPORTANT:
   NIGERIA FALLBACK LOCATION
========================================================= */

const FALLBACK_CENTER = {
  lat: 7.3775,
  lng: 3.9470
};


/* =========================================================
   APP SETTINGS
========================================================= */

const CATEGORIES = [
  "Food",
  "Music",
  "Sports",
  "Arts",
  "Community",
  "Shopping",
  "Services",
  "Fun",
  "Wellness"
];

const RADII = [1,3,5,10,25];

const state = {
  tab:"nearby",
  type:"all",
  cat:"All",
  radius:5,

  listings:[],
  loading:true,

  loc:{
    ...FALLBACK_CENTER,
    ok:false
  },

  saved:new Set(
    JSON.parse(
      localStorage.getItem("nearby_saved") || "[]"
    )
  )
};

let map = null;
let userMarker = null;
let listingMarkers = [];


/* =========================================================
   HELPERS
========================================================= */

function $(id) {
  return document.getElementById(id);
}

function showToast(message) {

  const toast = $("toast");

  toast.textContent = message;
  toast.hidden = false;

  clearTimeout(window.toastTimer);

  window.toastTimer = setTimeout(() => {
    toast.hidden = true;
  },4000);
}


function saveSaved() {

  localStorage.setItem(
    "nearby_saved",
    JSON.stringify([...state.saved])
  );
}


function haversine(a,b) {

  const R = 6371;

  const rad = Math.PI / 180;

  const dLat =
    (b.lat-a.lat)*rad;

  const dLng =
    (b.lng-a.lng)*rad;

  const h =
    Math.sin(dLat/2)**2 +
    Math.cos(a.lat*rad) *
    Math.cos(b.lat*rad) *
    Math.sin(dLng/2)**2;

  return 2 *
    R *
    Math.asin(Math.sqrt(h));
}


function formatDistance(km) {

  if(km < 1) {

    return Math.round(km*1000) + " m";

  }

  return km.toFixed(1) + " km";
}


function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g,c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));
}


/* =========================================================
   LOCATION
========================================================= */

async function requestLocation() {

  if(!navigator.geolocation) {

    showToast(
      "Your browser does not support location."
    );

    return false;
  }

  showToast(
    "Requesting your location..."
  );

  return new Promise(resolve => {

    navigator.geolocation.getCurrentPosition(

      position => {

        state.loc = {
          lat:position.coords.latitude,
          lng:position.coords.longitude,
          accuracy:position.coords.accuracy,
          ok:true
        };

        showToast(
          "Your actual location has been found."
        );

        updateLocationDisplay();

        render();

        if(state.tab === "map") {
          setTimeout(initMap,100);
        }

        resolve(true);
      },

      error => {

        console.log(
          "Geolocation error:",
          error
        );

        if(error.code === 1) {

          showToast(
            "Location permission was denied. Please allow location access in your browser settings."
          );

        } else if(error.code === 2) {

          showToast(
            "Your location is unavailable right now."
          );

        } else if(error.code === 3) {

          showToast(
            "Location request timed out. Try again."
          );

        } else {

          showToast(
            "We couldn't get your location."
          );
        }

        state.loc = {
          ...FALLBACK_CENTER,
          ok:false
        };

        updateLocationDisplay();

        render();

        resolve(false);
      },

      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      }
    );

  });
}


/* =========================================================
   LOCATION DISPLAY
========================================================= */

function updateLocationDisplay() {

  const el = document.querySelector(".locText");

  if(!el) return;

  if(state.loc.ok) {

    el.textContent =
      "Your current location";

  } else {

    el.textContent =
      "Location not enabled";
  }
}


/* =========================================================
   SAMPLE DATA
========================================================= */

function createSampleListings(center) {

  function at(km,angle) {

    const a =
      angle*Math.PI/180;

    return {

      lat:
        center.lat +
        (km*Math.cos(a))/111,

      lng:
        center.lng +
        (km*Math.sin(a)) /
        (111*Math.cos(center.lat*Math.PI/180))
    };
  }


  return [

    {
      id:"e1",
      type:"event",
      title:"Community Game Night",
      category:"Community",
      place:"Local Community Centre",
      ...at(0.8,30),
      starts_at:new Date(
        Date.now()+86400000
      ).toISOString(),
      blurb:"Come meet people, play games and have fun."
    },

    {
      id:"e2",
      type:"event",
      title:"Live Music Night",
      category:"Music",
      place:"Downtown Music Hall",
      ...at(1.4,100),
      starts_at:new Date(
        Date.now()+172800000
      ).toISOString(),
      blurb:"Enjoy live performances from local musicians."
    },

    {
      id:"e3",
      type:"event",
      title:"Weekend Food Market",
      category:"Food",
      place:"Central Market",
      ...at(1.1,200),
      starts_at:new Date(
        Date.now()+259200000
      ).toISOString(),
      blurb:"Food, drinks and local vendors all in one place."
    },

    {
      id:"e4",
      type:"event",
      title:"Football Fun Day",
      category:"Sports",
      place:"Community Sports Field",
      ...at(2.2,250),
      starts_at:new Date(
        Date.now()+345600000
      ).toISOString(),
      blurb:"A relaxed football event for everyone."
    },

    {
      id:"d1",
      type:"deal",
      title:"Food Special",
      category:"Food",
      place:"Local Restaurant",
      ...at(0.7,20),
      offer:"20% OFF",
      valid_until:"This week",
      blurb:"Get 20% off selected meals."
    },

    {
      id:"d2",
      type:"deal",
      title:"Shopping Discount",
      category:"Shopping",
      place:"Local Store",
      ...at(1.8,300),
      offer:"15% OFF",
      valid_until:"This month",
      blurb:"Save money on selected products."
    }

  ];
}


/* =========================================================
   LOAD LISTINGS
========================================================= */

async function loadListings() {

  state.loading = true;

  render();

  try {

    if(LIVE) {

      const response = await fetch(
        `${CONFIG.SUPABASE_URL}/rest/v1/listings?select=*&order=created_at.desc&limit=500`,
        {
          headers:{
            apikey:CONFIG.SUPABASE_KEY
          }
        }
      );

      if(!response.ok) {
        throw new Error("Supabase error");
      }

      state.listings =
        await response.json();

    } else {

      state.listings =
        createSampleListings(
          state.loc.ok
            ? state.loc
            : FALLBACK_CENTER
        );
    }

  } catch(error) {

    console.error(error);

    state.listings =
      createSampleListings(
        state.loc.ok
          ? state.loc
          : FALLBACK_CENTER
      );

    showToast(
      "Using nearby demo listings."
    );
  }

  state.loading = false;

  render();
}


/* =========================================================
   FILTER LISTINGS
========================================================= */

function getVisibleListings() {

  return state.listings

    .map(item => ({
      ...item,
      _km:haversine(
        state.loc,
        item
      )
    }))

    .filter(item => {

      if(item._km > state.radius)
        return false;

      if(
        state.cat !== "All" &&
        item.category !== state.cat
      )
        return false;

      if(
        state.type !== "all" &&
        item.type !== state.type
      )
        return false;

      return true;
    })

    .sort(
      (a,b) =>
        a._km-b._km
    );
}


/* =========================================================
   RENDER FILTERS
========================================================= */

function renderFilters() {

  $("filters").innerHTML = `

    <div class="locRow">

      <div class="locLeft">

        <span>📍</span>

        <span class="locText">
          ${
            state.loc.ok
              ? "Your current location"
              : "Location not enabled"
          }
        </span>

      </div>

      <button
        class="radiusBtn"
        onclick="requestLocation()"
      >
        ${
          state.loc.ok
            ? "Update location"
            : "Use my location"
        }
      </button>

    </div>


    <div class="seg">

      <button
        aria-pressed="${
          state.type==="all"
        }"
        onclick="setType('all')"
      >
        All
      </button>

      <button
        aria-pressed="${
          state.type==="event"
        }"
        onclick="setType('event')"
      >
        Events
      </button>

      <button
        aria-pressed="${
          state.type==="deal"
        }"
        onclick="setType('deal')"
      >
        Deals
      </button>

    </div>


    <div class="chips">

      <button
        class="chip"
        aria-pressed="${
          state.cat==="All"
        }"
        onclick="setCategory('All')"
      >
        All
      </button>

      ${CATEGORIES.map(category => `

        <button
          class="chip"
          aria-pressed="${
            state.cat===category
          }"
          onclick="setCategory('${category}')"
        >
          ${category}
        </button>

      `).join("")}

    </div>

  `;
}


/* =========================================================
   RENDER LIST
========================================================= */

function renderListings() {

  const content = $("content");

  if(state.loading) {

    content.innerHTML =
      `<div class="empty">
        <h3>Loading nearby places...</h3>
        <p>Please wait.</p>
      </div>`;

    return;
  }


  const listings =
    getVisibleListings();


  if(!listings.length) {

    content.innerHTML = `

      <div class="empty">

        <h3>No nearby listings</h3>

        <p>
          Try increasing your radius
          or changing the category.
        </p>

        <button
          onclick="requestLocation()"
        >
          📍 Use my location
        </button>

      </div>

    `;

    return;
  }


  content.innerHTML =
    listings.map(item => {

      const saved =
        state.saved.has(item.id);

      let dateText = "";

      if(item.type==="event") {

        dateText =
          new Date(
            item.starts_at
          ).toLocaleString(
            [],
            {
              weekday:"short",
              month:"short",
              day:"numeric",
              hour:"numeric",
              minute:"2-digit"
            }
          );

      } else {

        dateText =
          item.valid_until ||
          "Limited time";
      }


      return `

        <article
          class="card"
          onclick="openListing('${item.id}')"
        >

          <div class="cardMain">

            <div class="stub ${
              item.type==="event"
                ? "ev"
                : "dl"
            }">

              <div class="big">

                ${
                  item.type==="event"
                    ? "EVENT"
                    : esc(item.offer)
                }

              </div>

              <div class="small">

                ${
                  item.type==="event"
                    ? "Nearby"
                    : "DEAL"
                }

              </div>

            </div>


            <div class="body">

              <div class="title">
                ${esc(item.title)}
              </div
